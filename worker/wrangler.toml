# Config for the Bilbrey Family Dinner Planner Worker — local dev, tests AND production.
# Since 2026-11-15 production deploys through Cloudflare Workers Builds: every push to main that
# touches worker/ runs `npx wrangler deploy` from this folder (see DEPLOY.md). Keep the bindings
# below identical to what's live: the KITCHEN Durable Object, Workers AI, observability on.
name = "bilbrey-dinner-planner"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "KITCHEN"
class_name = "Kitchen"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Kitchen"]

# Workers AI always runs remotely, even under `wrangler dev` (needs `wrangler login`).
# The automated tests replace this binding with a mock (see test/fixtures/entry.mjs).
[ai]
binding = "AI"

[observability]
enabled = true

# Claude for scans, receipts and recipe ideas (SPEC §14). ANTHROPIC_API_KEY is a SECRET, added in the
# dashboard (Worker → Settings → Variables and Secrets → type "Secret"); deploys keep secrets. Plain-text
# variables typed into the dashboard are replaced by this block on every deploy, so the monthly Claude
# spending cap (USD, America/Chicago months; "0" turns Claude off) lives here.
[vars]
AI_MONTHLY_CAP_USD = "5"
